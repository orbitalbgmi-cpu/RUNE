name: Build RUNE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore RUNE.csproj
      - name: Build and publish
        run: dotnet publish RUNE.csproj -c Release -r win-x64 --self-contained false -o publish
      - name: Upload built app
        uses: actions/upload-artifact@v4
        with:
          name: RUNE-exe
          path: publish
